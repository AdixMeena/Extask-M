# Runs on every push: if lint, tests or the build break, GitHub shows a red cross.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm run lint
      - run: npm test
      - run: npm run build
